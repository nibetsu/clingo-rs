name: CI tests

on: [push]

jobs:
  linux:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          miniconda-version: "latest"
      - name: Conda install clingo
        shell: bash -el {0}
        run: |
          conda install -c potassco -c conda-forge clingo=5.8.3
          echo "CLINGO_LIBRARY_PATH=$CONDA_PREFIX/lib" >> $GITHUB_ENV
      - name: Build
        run: |
          cargo build --features=derive --verbose
      - name: Run tests
        run: |
          export LD_LIBRARY_PATH=$CLINGO_LIBRARY_PATH
          cargo test --features=derive --verbose
  macos:
    runs-on: "macos-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          miniconda-version: "latest"
      - name: Conda install clingo
        shell: bash -el {0}
        run: |
          conda install -c potassco -c conda-forge clingo=5.8.3
          echo "CLINGO_LIBRARY_PATH=$CONDA_PREFIX/lib" >> $GITHUB_ENV
      - name: Build
        run: |
          cargo build --features=derive --verbose
      - name: Run tests
        run: |
          export DYLD_LIBRARY_PATH=$CLINGO_LIBRARY_PATH
          cargo test --features=derive --verbose
  windows:
    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          miniconda-version: "latest"
      - name: Conda install clingo
        shell: bash -el {0}
        run: |
          conda install -c potassco -c conda-forge clingo=5.8.3
          echo "CLINGO_LIBRARY_PATH=$CONDA_PREFIX\\Library\\lib" >> $GITHUB_ENV
          echo "$CONDA_PREFIX\\Library\\bin" >> $GITHUB_PATH
      - name: Build
        run: |
          cargo build --features=derive --verbose
      - name: Run tests
        run: |
          cargo test --features=derive --verbose
  linux-static:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --features=static-linking,derive --verbose
      - name: Run tests
        run: cargo test --features=static-linking,derive --verbose
  macos-static:
    runs-on: "macos-latest"
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --features=static-linking,derive --verbose
      - name: Run tests
        run: cargo test --features=static-linking,derive --verbose
  windows-static:
    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --features static-linking,derive -vv
      - name: Run tests
        run: cargo test --features static-linking,derive --verbose
